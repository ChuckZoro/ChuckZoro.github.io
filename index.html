<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Robert Beasley: former HVAC and appliance technician building toward AI engineering and AI security."
  />

  <title>Robert Beasley | AI Engineering &amp; AI Security</title>

  <style>
    :root {
      --background: #071019;
      --surface: #0d1823;
      --surface-light: #132230;
      --border: #213547;
      --text: #edf6ff;
      --muted: #9eb1c4;
      --accent: #36e3a5;
      --accent-dark: #19b982;
      --blue: #5db7ff;
      --danger: #ff6b7a;
      --max-width: 1160px;
      --radius: 18px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(54, 227, 165, 0.09), transparent 28rem),
        radial-gradient(circle at 88% 22%, rgba(93, 183, 255, 0.08), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .container {
      width: min(calc(100% - 2rem), var(--max-width));
      margin-inline: auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 1.4rem;
      height: 2px;
      background: var(--accent);
      content: "";
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 2.25rem;
    }

    .section-heading h2 {
      margin-bottom: 0.8rem;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 1.02rem;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(7, 16, 25, 0.83);
      backdrop-filter: blur(16px);
    }

    .nav {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(54, 227, 165, 0.35);
      border-radius: 11px;
      background: rgba(54, 227, 165, 0.08);
      color: var(--accent);
      font-family: "Courier New", monospace;
      font-size: 0.8rem;
      box-shadow: inset 0 0 18px rgba(54, 227, 165, 0.05);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.6rem;
      color: var(--muted);
      font-size: 0.93rem;
      font-weight: 700;
    }

    .nav-links a {
      transition: color 160ms ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--accent);
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1.5rem;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: calc(100vh - 72px);
      align-items: center;
      padding: 5rem 0;
    }

    .hero-grid {
      display: grid;
      align-items: center;
      gap: 4rem;
      grid-template-columns: 1.2fr 0.8fr;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.4rem;
      padding: 0.48rem 0.82rem;
      border: 1px solid rgba(54, 227, 165, 0.24);
      border-radius: 999px;
      background: rgba(54, 227, 165, 0.08);
      color: #bff7e3;
      font-size: 0.84rem;
      font-weight: 750;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(54, 227, 165, 0.09);
    }

    .hero h1 {
      max-width: 800px;
      margin-bottom: 1.3rem;
      font-size: clamp(3.1rem, 8vw, 6.6rem);
      line-height: 0.96;
      letter-spacing: -0.065em;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero-copy {
      max-width: 670px;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.22rem);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 2rem;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.78rem 1.1rem;
      border: 1px solid transparent;
      border-radius: 12px;
      font-weight: 850;
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        background 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--accent);
      color: #03271d;
      box-shadow: 0 10px 30px rgba(54, 227, 165, 0.2);
    }

    .button-primary:hover {
      background: #56edb8;
    }

    .button-secondary {
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.025);
      color: var(--text);
